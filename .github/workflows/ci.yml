name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # The build never touches the database or AI provider: route handlers
          # are dynamic (force-dynamic) and not executed at build time, and the
          # DB client falls back to a local file when unset. Real secrets live
          # in Vercel, not in CI.
          TURSO_DATABASE_URL: "file:ci.db"
